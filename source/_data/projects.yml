- id: reliable-deep-research
  name: Reliable Deep Research
  category: 深度研究
  description: 基于 Open Deep Research，增加任务结果持久化、失败重试和报告审核。研究中断后复用已提交的任务结果，生成报告时检查问题覆盖和引用支持。
  repo: https://github.com/hilzlzl/reliable-deep-research
  article: /2026/10/22/reliable-deep-research/
  docs: https://github.com/hilzlzl/reliable-deep-research/blob/main/docs/project_overview.zh-CN.md
  evaluation: https://github.com/hilzlzl/reliable-deep-research/blob/main/docs/evaluation.zh-CN.md
  stack: [Python, LangGraph, SQLite, asyncio]
  diagram: |
    flowchart TD
      A[研究问题] --> B[任务拆分与检索]
      B --> C[报告生成与审核]
      C --> D[报告与引用]
      B <--> E[(SQLite 任务与证据)]
      C -. 补搜与修复 .-> B
  features:
    - title: 任务恢复
      text: 以研究任务为恢复边界，持久化已提交结果，重试失败任务并清理过期证据。
    - title: 报告审核
      text: 先固定问题要点，再审核段落证据与问题覆盖，由 Evidence ID 渲染引用。
    - title: 预算限制
      text: 最多两轮报告修复、两个定向补搜任务，并发研究共享调用与时间预算。
  metrics:
    - value: 59/60
      label: 开发汇总验收通过
    - value: 88.7%
      label: 全部槽位要点覆盖
    - value: 20/20
      label: 提交后重启复用实验
  note: 报告指标为两次覆盖版本实验的替换后开发汇总，60 个槽位经历 73 次生成；重启复用为独立合成实验。统计口径与局限见评测文档。
- id: courseagent
  name: CourseAgent
  category: 课程作业
  description: 根据教师需求和课程资料搜集普通题、编程题，核对答案并执行参考程序。结果可导出为本地文件，也可保存至头歌未发布试卷。
  repo: https://github.com/hilzlzl/CourseAgent
  article: /2026/10/27/courseagent/
  docs: https://github.com/hilzlzl/CourseAgent/blob/main/docs/quickstart.md
  evaluation: https://github.com/hilzlzl/CourseAgent/blob/main/docs/evaluation.md
  stack: [Python, LangGraph, SQLite, bubblewrap]
  diagram: |
    flowchart TD
      A[教师需求与课程资料] --> B[搜题与筛选]
      B --> C[答案与参考程序核验]
      C --> D[Excel / JSON / 教师评测包]
      C --> E[头歌未发布试卷]
  features:
    - title: 搜题与筛选
      text: 普通题与编程题并行搜集，结合课程资料、考点和选题历史筛选。
    - title: 答案核验
      text: 核对公开样例，在 Linux 沙箱执行参考程序，生成教师使用的评测数据。
    - title: 文件导出与平台保存
      text: 导出 Excel、JSON 与教师评测包，支持平台保存和回读核对，也可仅本地生成。
  metrics:
    - value: 97.26%
      label: 题目完成率 · 852/876
    - value: 55/60
      label: 整套任务完成
    - value: '20 × 3'
      label: 需求数 × 每需求运行次数
  note: 完成率按生成结果统计，题目质量与平台保存回读分别评估；有限样例核验后仍需教师审阅。详情见评测文档。
